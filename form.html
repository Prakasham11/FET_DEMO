<html>
<body>
<h1>Simple HTML Form</h1>
<form>

<label>Name:</label>
<input type="text" name="username" required>
<br><br>
<label>Department:</label>
<input type="text" name="password">
<br><br>
<label>Contact:</label>
<input type="number" name="number">
<br><br>
<label>Address:</label>
<textarea name="address" rows="4" cols="30"></textarea>

<p> Choose your language </p>
<input type="radio"  name="language" value="HTML">
<label>HTML</label>
<input type="radio"  name="language" value="Java">
<label>JAVA</label>

<input type="radio" name="language" value="DBMS">
<label>DBMS</label>
<br><br>
<input type="checkbox" name="Hobbies" value="Dancing">
<label>Dancing</label>
<input type="checkbox" name="Hobbies" value="Gardening">
<label>Gardening</label>
<input type="checkbox" name="Hobbies" value="Cycling">
<label>Cycling</label>


<br><br>
<input type="Submit" value="submit">

</form>
</body>
</html>
