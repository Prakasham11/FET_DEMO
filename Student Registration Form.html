# Simple Student Registration Form

<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>

<body>

<h2>Student Registration Form</h2>

<form>

    <label>Name:</label>
    <input type="text" name="name">
    <br><br>

  
    <label>Email ID:</label>
    <input type="email" name="email">
    <br><br>

    
    <label>contact:</label>
    <input type="number" name="contact">
    <br><br>

    
    <label>Password:</label>
    <input type="text" name="password">
    <br><br>

  
    <label>Gender:</label>

    <input type="radio" name="gender"  value="male">
    Male
    <input type="radio" name="gender"  value="female">
    Female

    <br><br>
    
    <label>Skills:</label>
    <input type="checkbox" name="skill" value="html">
    HTML
    <input type="checkbox" name="skill" value="css">
    CSS

    <input type="checkbox" name="skill" value="javascript">
    JavaScript

    <br><br>

 
    <label>Address:</label>
    <br>

    <textarea name="address" rows="4" cols="30"></textarea>

    <br><br>

    <!-- Buttons -->
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

</form>

</body>
</html>
