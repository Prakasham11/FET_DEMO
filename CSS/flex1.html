
<!DOCTYPE html>
<html>
<head>
    <title>All Flexbox Properties</title>

    <style>
        
        .container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background-color: lightgray;
            padding: 20px;
            min-height: 200px;
        }

       
        .box {
            flex: 1;
            background-color: steelblue;
            color: white;
            padding: 20px;
            text-align: center;
            min-width: 100px;
        }

       
        .column-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: lightyellow;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h2>1. Flexbox Row Layout</h2>

    <div class="container">
        <div class="box">HTML</div>
        <div class="box">CSS</div>
        <div class="box">JavaScript</div>
        <div class="box">Python</div>
    </div>

    <h2>2. Flexbox Column Layout</h2>

    <div class="column-container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
    </div>

</body>
</html>
