<!DOCTYPE html>
<html>
<head>
    <title>Rotate Animation</title>

    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: purple;

            animation: rotateBox 3s infinite;
        }

        @keyframes rotateBox {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="box"></div>

</body>
</html>
